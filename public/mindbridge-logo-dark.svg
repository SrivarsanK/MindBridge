<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle background -->
  <circle cx="50" cy="50" r="47" fill="url(#gradient-dark)" opacity="0.9"/>
  
  <!-- Outer circle border -->
  <circle cx="50" cy="50" r="47" stroke="url(#gradient-dark)" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Left profile silhouette -->
  <path d="M 25 35 Q 30 25, 35 30 Q 40 35, 42 45 L 42 65 Q 38 70, 30 68 Q 22 65, 20 55 Q 18 45, 25 35 Z" fill="white" opacity="1"/>
  
  <!-- Right hand reaching toward left -->
  <path d="M 70 45 Q 68 42, 65 43 L 60 45 Q 58 46, 58 48 L 58 52 Q 58 54, 60 55 L 65 57 Q 68 58, 70 55 Q 72 52, 70 50 L 70 45 Z" fill="white" opacity="0.9"/>
  
  <!-- Hand fingers -->
  <path d="M 58 46 Q 56 45, 54 46 L 54 49 Q 56 50, 58 48 Z" fill="white" opacity="0.8"/>
  <path d="M 58 48 Q 56 47, 54 48 L 54 51 Q 56 52, 58 50 Z" fill="white" opacity="0.8"/>
  <path d="M 58 50 Q 56 49, 54 50 L 54 53 Q 56 54, 58 52 Z" fill="white" opacity="0.8"/>
  <path d="M 58 52 Q 56 51, 54 52 L 54 55 Q 56 56, 58 54 Z" fill="white" opacity="0.8"/>
  
  <!-- Left hand reaching toward right -->
  <path d="M 30 45 Q 32 42, 35 43 L 40 45 Q 42 46, 42 48 L 42 52 Q 42 54, 40 55 L 35 57 Q 32 58, 30 55 Q 28 52, 30 50 L 30 45 Z" fill="white" opacity="0.9"/>
  
  <!-- Left hand fingers -->
  <path d="M 42 46 Q 44 45, 46 46 L 46 49 Q 44 50, 42 48 Z" fill="white" opacity="0.8"/>
  <path d="M 42 48 Q 44 47, 46 48 L 46 51 Q 44 52, 42 50 Z" fill="white" opacity="0.8"/>
  <path d="M 42 50 Q 44 49, 46 50 L 46 53 Q 44 54, 42 52 Z" fill="white" opacity="0.8"/>
  <path d="M 42 52 Q 44 51, 46 52 L 46 55 Q 44 56, 42 54 Z" fill="white" opacity="0.8"/>
  
  <!-- Sparkle star top left -->
  <g transform="translate(20,20)">
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="url(#gradient-dark)" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Sparkle star bottom right -->
  <g transform="translate(80,75)">
    <path d="M 0 -3 L 0.8 -0.8 L 3 0 L 0.8 0.8 L 0 3 L -0.8 0.8 L -3 0 L -0.8 -0.8 Z" fill="url(#gradient-dark)" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Gradient definition for dark mode -->
  <defs>
    <linearGradient id="gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#67e8f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7dd3fc;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
